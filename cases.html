    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: "Switzer", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
    a { color: var(--text); text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; }
    ::selection { background: #877F76; }
    :focus-visible { outline: 1px solid var(--text); outline-offset: 3px; }

    .wrap { height: 100%; display: flex; flex-direction: column; }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 48px 48px 0;
      font-size: 15px;
      letter-spacing: -0.2px;
    }
    .back-link { color: var(--text); }
    .back-link a { color: var(--dim); text-decoration: none; position: relative; transition: color 0.3s ease; }
    .back-link a:hover { color: var(--text); }
    .back-link a:hover .bc-plus { opacity: 1; transform: translate(0, -50%); }
    .bc-plus {
      position: absolute; right: 100%; top: 50%; width: 9px; height: 9px;

      pointer-events: none;
    }
    .bc-plus::before { content: ""; position: absolute; left: 0; right: 3px; top: 50%; height: 1px; background: var(--text); }
    .bc-plus::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - 2px); width: 1px; background: var(--text); }

    #tabs { display: flex; gap: 34px; border-bottom: 0.5px solid var(--text); margin: 16px var(--pw) 0 var(--lm); }
    .tab { position: relative; font-size: 16px; padding: 8px 0; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -0.5px; cursor: pointer; transition: color .3s, border-color .3s; }
    .tab[aria-selected="true"] { color: var(--text); border-color: var(--text); }
    .tab::before { content: "+"; position: absolute; left: -12px; top: 50%; line-height: 1; opacity: 0; transform: translate(4px, calc(-50% + 1px)); transition: opacity .3s, transform .3s; color: var(--text); }
    .tab:hover::before { opacity: 1; transform: translate(0, calc(-50% + 1px)); }

    #pg { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--pw); }
    #lf { min-height: 0; padding: 14px 40px 52px var(--lm); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 24px; row-gap: 38px; align-items: stretch; grid-template-areas: "ti ti ti" "se rs rs" "st st st"; }
    .cell { min-height: 0; opacity: 0; transform: translateY(4px); transition: opacity .4s, transform .4s; }

    #rp .k { color: #1f1e1b; }

    #ttl { font-family: "Advercase", Georgia, serif; font-weight: 400; font-size: clamp(44px, 7vh, 68px); line-height: .95; margin-top: 2px; }
    #fwl { margin-top: 14px; display: flex; gap: 36px; }
    .v16 { font-size: 16px; margin-top: 1px; }

    #se { align-self: start; display: flex; flex-direction: column; }
    #se .ph { flex: none; height: clamp(190px, calc(32vh - clamp(0px, calc((860px - 100vh) / 3.2), 25px)), 330px); position: relative; overflow: hidden; background: #3a3936; }
    #se .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    #se .lbl2 { margin-top: 7px; }
    #se .first { margin-top: 12px; }

    #rs { align-self: start; margin-left: 18px; display: flex; flex-direction: column; }

    .rhead span:last-child { text-align: right; }
    #rows { display: flex; flex-direction: column; position: relative; }
    #rows::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(150px + (100% - 150px) / 2); border-left: 0.5px solid var(--text); }
    .rw { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; font-size: 13px; cursor: default; transition: opacity .25s; }

    .box { background: var(--fill); border-radius: 50%; height: 78px; padding: 8px 28px calc(8px + var(--bn) * var(--lift)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

    .spacer { flex: 1 1 0; }
    #circ { flex: none; margin: 0 auto; width: 224px; height: 100px; border-radius: 50%; border: 0.5px solid var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 16px calc(10px + var(--bn) * var(--lift)); }
    #circ .big { color: var(--text); }
    #circ .sub { font-size: 11px; color: var(--dim); margin-top: -3px; line-height: 1.25; }

    #tl { flex: none; padding-top: 12px; margin-bottom: 18px; }
    .tlist { list-style: none; margin-top: 8px; }
    .tlist li { position: relative; padding-left: 26px; height: 48px; }
    .tlist li:last-child { height: auto; }
    .tp { position: absolute; left: 0; top: 4px; width: 11px; height: 11px; }
    .tp::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: var(--text); }
    .tp::after { content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 1px; background: var(--text); }
    .tlist li:not(:last-child)::after { content: ""; position: absolute; left: 5px; top: 21px; height: 25px; width: 1px; background: var(--text); transform-origin: top; }
    .tt { font-size: 13px; font-weight: 700; line-height: 1.25; }
    .td { font-size: 12px; line-height: 1.3; color: #1f1e1b; }
    @keyframes tlIn { from { opacity: 0; transform: translate3d(-4px, 0, 0); } to { opacity: 1; transform: none; } }
    @keyframes tlDraw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .tp, .tt, .td { animation: tlIn .55s cubic-bezier(.22, 1, .36, 1) both; will-change: opacity, transform; }
    .tlist li:not(:last-child)::after { animation: tlDraw .45s cubic-bezier(.45, 0, .2, 1) both; will-change: transform; }
    .tlist li:nth-child(1) .tp, .tlist li:nth-child(1) .tt, .tlist li:nth-child(1) .td { animation-delay: .1s; }
    .tlist li:nth-child(1)::after { animation-delay: .3s; }
    .tlist li:nth-child(2) .tp, .tlist li:nth-child(2) .tt, .tlist li:nth-child(2) .td { animation-delay: .65s; }
    .tlist li:nth-child(2)::after { animation-delay: .8s; }
    .tlist li:nth-child(3) .tp, .tlist li:nth-child(3) .tt, .tlist li:nth-child(3) .td { animation-delay: 1.15s; }

    @media (max-height: 820px) and (min-width: 1001px) {
      #rp { padding-top: 16px; padding-bottom: 8px; }
      .vt { font-size: 15px; line-height: 1.35; margin-top: 8px; }
      .gh { margin-top: 12px; }
      #circ { width: 208px; height: 80px; }
      #tl { padding-top: 6px; margin-bottom: 10px; }
      .tlist li { height: 44px; }
      .tlist li:not(:last-child)::after { height: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell, .bar, .rw, #info { transition: none; }
      .tp, .tt, .td, .tlist li::after { animation: none; }
    }

    @media (max-width: 1000px), (max-height: 640px) {
      body { overflow: auto; }
      .wrap { height: auto; min-height: 100%; padding-bottom: 28px; }
      .page-head { padding: 28px 20px 0; }
      #tabs { margin: 16px 20px 0; flex-wrap: wrap; gap: 8px 26px; }
      #pg { display: block; }
      #lf { display: block; padding: 20px; }
      #lf > * { margin-bottom: 28px; }
      #rs { margin-left: 0; }
      #st { grid-template-columns: 1fr; }
      #rp { padding: 24px 20px; }
      #info { min-height: 0 !important; }
      .spacer { flex: none; height: 24px; }
    }
  </style>

"Functions", "img": "img/case-agco.jpg", "alt": "Aerial view of a tractor at the edge of a field", "v": "Black Basta struck on 5 May 2022, during peak planting season. Two FBI notices about the group preceded the attack. Identification, protection, and detection failed, but the response held: operations were shut down and contained within days. Recovery still ran longer than the containment.", "link": "https://github.com/drea-wichman/case-studies/blob/main/agco-ransomware-2022.md", "rows": [["Identify", "NIST function", "Two FBI warnings named the threat. No visible reassessment or response followed.", "fail"], ["Protect", "NIST function", "Ransomware crossed facilities in France, Germany, and China within hours. No effective segmentation.", "fail"], ["Detect", "NIST function", "Data stolen and systems encrypted before AGCO knew it was under attack.", "fail"], ["Respond", "NIST function", "Systems shut down fast, disclosure next day, law enforcement engaged. Organised.", "pass"], ["Recover", "NIST function", "Two weeks to restore, during planting season. Backups incomplete, untested, or reachable.", "part"]]}, "sl": {"id": "CS-003", "nm": "Salesloft Drift", "fw": "NCSC Supply Chain Principles", "yr": "2025", "sector": "Software / SaaS", "region": "Global", "threat": "UNC6395 (Google)", "enf": "None reported", "stats": [["10", "days of data export"], ["700+", "organizations potentially impacted"], ["3", "months undetected"]], "inv": ["5 of 12", "principles had no buyer mechanism"], "time": [["Mar 2025", "GitHub access begins"], ["Aug 2025", "Ten days of data export"], ["20 Aug", "Customers notified"]], "unit": "Principles", "img": "img/case-salesloft.jpg", "alt": "Aerial view of rows of office cubicles", "v": "UNC6395 held access to Salesloft's GitHub from March 2025 and spent ten days in August exporting data from customer Salesforce environments. More than 700 organizations were potentially impacted through a connection each had approved. Their own controls did not         '<div class="box"><div class="big">' + s[2][0] + '</div><div class="sub">' + s[2][1] + '</div></div>';
    }
    function timeline(c) {
      $("tl").innerHTML = '<div class="k">Timeline</div><ol class="tlist">' + c.time.map(function (e) {
        return '<li><i class="tp" aria-hidden="true"></i><div class="tt">' + e[0] + '</div><div class="td">' + e[1] + '</div></li>';
      }).join("") + '</ol>';
    }

    function draw(c) {
      clearT(); reserve(); showInfo(c); header(c); side(c); results(c); stats(c); timeline(c);
      $("circ").innerHTML = '<div class="big">' + c.inv[0] + '</div><div class="sub">' + c.inv[1] + '</div>';
      var cells = document.querySelectorAll("#lf .cell");
      Array.prototype.forEach.call(cells, function (e, i) {
        e.classList.remove("in");
        later(function () { e.classList.add("in"); }, 30 + i * 50);
      });
    }

    function show(k, fromClick) {
      if (k === cur) return;
      cur = k;
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
        t.setAttribute("aria-selected", t.dataset.k === k ? "true" : "false");
      });
      draw(C[k]);
      IN.style.opacity = 0;
      later(function () { IN.style.opacity = 1; }, 180);
      if (fromClick && history.replaceState) history.replaceState(null, "", "#" + k);
    }

    ORDER.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.dataset.k = k; b.setAttribute("role", "tab");
      b.textContent = C[k].nm;
      b.addEventListener("click", function () { show(k, true); });
      $("tabs").appendChild(b);
    });
    window.addEventListener("resize", reserve);

    var h = (location.hash || "").replace("#", "");
    show(C[h] ? h : ORDER[0]);
  </script>
</body>
</html>
